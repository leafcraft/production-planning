# production-planning — Production Planning & Scheduling
#
# Demand sense → schedule re-optimization → constraint flag → release.
# Rule 1: team. Multi-entry (demand signal, capacity change, scheduled
# re-opt, manual). Planners govern major changes; routine
# re-optimizations run agent-side.
#
# WHY LEAFMESH — prod × goods, COGS, cost, pool 14% of revenue,
# routine 70%, internal visibility. Planners spend loaded hours
# rebuilding schedules every cycle; agents carry the routine.

name: "production-planning"
version: "1.0.0"
architecture: "managed_mesh"
environment: "development"
debug: true
log_level: "INFO"

redis:
  host: "${REDIS_HOST:localhost}"
  port: ${REDIS_PORT:6379}
  db: 0
  password: "${REDIS_PASSWORD:}"
  auto_storage: true
  decode_responses: true
  default_ttl: 86400
  session_ttl: 604800

auto_discover:
  directory: "./agency"
  pattern: "*_agent.py"
  recursive: false

manager:
  enabled: true
  model: "gpt-4o-mini"
  domain: "generic"
  can_intervene: true

  prompt: |
    This mesh runs production planning + scheduling. A successful turn:
      - demand_sensor pulls forecast + actuals
      - capacity_model checks line / shift / equipment availability
      - scheduler_agent (re-)optimises the production sequence
      - constraint_flagger surfaces conflicts (material shortage,
        capacity bottleneck, deadline miss)
      - if conflicts found → planner_human decides
      - clean re-opts auto-release to MES

    Escalate when:
      - constraint_flagger reports unresolvable shortage
      - schedule changes affect on-time delivery for a top-20 SKU
      - same conflict pattern recurs across 3+ shifts
      - safety_stock floor would be breached

    Watch for:
      - chronic bottleneck patterns (same line, same shift)
      - demand vs capacity drift > 15% over rolling 14 days
      - planner intervention rate trending up (signals upstream issue)

  routing:
    mode: "learning"
    memory_size: 200
    confidence_threshold: 0.7
    fallback: "all"
    decay_days: 30

  knowledge:
    serviceName: "mongo_main"
    enabled: true
    groupName: "planning_playbook"

  escalation:
    targets:
      - type: "human_agent"
        agent: "ops_director_human"
      - type: "webhook"
        url: "${PAGER_WEBHOOK:https://events.pagerduty.com/v2/enqueue}"
        method: "POST"
        headers:
          Content-Type: "application/json"
        payload_template:
          incident_id: "{{schedule_id}}"
          severity: "{{severity}}"
          message: "{{message}}"
          session_id: "{{session_id}}"
      - type: "channel"
        provider: "slack"
        channel_id: "${SLACK_PLANT_CHANNEL:}"
        message_template: "[planning] {{message}} — schedule {{schedule_id}} (session {{session_id}})"

    auto_escalate:
      max_retries: 2
      max_errors_per_session: 3
      timeout_threshold: 2

  health_check_interval: 60
  agent_timeout_threshold: 300
  chain_completion_timeout: 600

mesh:
  call_timeout: 120

data_structures:
  PlanEvent:
    type: "object"
    properties:
      schedule_id: { type: "string" }
      plant_id: { type: "string" }
      line_id: { type: "string" }
      signal_source: { type: "string" }      # demand | capacity | scheduled | manual
      planning_window_days: { type: "number" }
      received_at_utc: { type: "string" }
      raw_payload: { type: "object" }
    required: ["plant_id", "signal_source"]

entry_points:
  - name: "demand_signal"
    target: "demand_sensor_agent"
    description: "New demand forecast OR actual order shifts demand picture"

  - name: "capacity_change"
    target: "capacity_model_agent"
    description: "Line down / shift change / equipment maintenance event"

  - name: "scheduled_reopt"
    target: "scheduler_agent"
    description: "Cron-driven periodic re-optimization"

  - name: "manual_action"
    target: "scheduler_agent"
    description: "Planner-initiated re-opt"

  - name: "mrp_compute"
    target: "material_requirements_agent"
    description: "Compute material requirements from demand × BOM"

  - name: "shift_kpi_ingest"
    target: "planning_analytics_agent"
    description: "Record one shift KPI row (ingest mode)"

  - name: "production_kpi_report"
    target: "planning_analytics_agent"
    description: "Read OEE / availability / quality rollups (report mode)"

  - name: "supplier_signal"
    target: "supplier_signal_agent"
    description: "Supplier delay/quality/capacity webhook"

  - name: "supplier_capacity_change"
    target: "supplier_signal_agent"
    description: "Supplier announces capacity reduction — re-plan against new ceiling"

  - name: "raw_material_shortage"
    target: "supplier_signal_agent"
    description: "Commodity-level shortage alert — multi-supplier impact assessment"

  - name: "shortage_alert"
    target: "constraint_flagger_agent"
    description: "Material shortage / supplier delay webhook"


# ── Direct-call entry points (every non-human, non-terminal
#    agent is API-addressable; bypasses the upstream chain).
#    Use for ad-hoc invocation, debugging, programmatic ingest.
  - name: "direct_call_release"
    target: "release_agent"
    description: "On-demand direct call to release (programmatic) — bypasses upstream chain"

  - name: "direct_call_rolling_reopt_orchestrator"
    target: "rolling_reopt_orchestrator_agent"
    description: "On-demand direct call to rolling_reopt_orchestrator (programmatic) — bypasses upstream chain"

  # ── Lyzr-inspired agents (added in 2.3.x) ──
  - name: "capacity_what_if_run"
    target: "capacity_what_if_agent"
    description: "Scenario sim — add_shift / line_down / demand_spike / supplier_outage etc."

  - name: "demand_forecast_backtest"
    target: "planning_analytics_agent"
    description: "Backtest forecasts vs actuals → MAPE/bias/tracking-signal + model recommendations per SKU (backtest mode)"


agents:

  demand_sensor_agent:
    name: "demand_sensor_agent"
    agent_type: "llm"
    description: "Pulls demand forecast + actuals, produces a planning-ready demand picture"
    model: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 800
    communication_type: "chain"

    prompt: |


      You are the demand planner. context["prepared_data"] carries the
      planning-ready demand picture already pulled from the plant's demand
      systems (pre_compose did this) — sku_demands, planning_window_days,
      notable_shifts. Reason over the real numbers; don't invent SKUs.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:

      {"sku_demands": [], "confidence": 0, "notable_shifts": []}
      Build the demand picture for the planning window:
        - sku_demands: list of {sku, units, due_date, customer_segment}
        - confidence: 0..1
        - notable_shifts: changes vs prior period

    enforce_yields: true
    enforce_yields_retry: 2

    knowledge:
      serviceName: "mongo_main"
      enabled: true
      groupName: "demand_signals"

    yields:
      sku_demands: "list"
      confidence: "number"
      notable_shifts: "list"

    inputs:
      payload: "object"

    can_call:
      - agent: "capacity_model_agent"

    auto_store_response: true
    auto_store_yields: true

  capacity_model_agent:
    name: "capacity_model_agent"
    agent_type: "programmatic"
    description: "Reads line / shift / equipment availability from your MES (or ERP work-centre calendar)"
    communication_type: "chain"

    # ── YOUR SYSTEM OF RECORD ────────────────────────────────────
    # Line + shift capacity lives in your MES / ERP work-centre
    # calendar, not in this template. Point this connector at an MCP
    # gateway (or swap integration to n8n/zapier) that returns the
    # yields below.
    integration: "mcp"
    connector_config:
      transport: "http"
      url: "${MES_MCP_URL:}"            # your MES / ERP MCP gateway
      tool_name: "get_line_capacity"    # must return the yields below
      timeout: 30

    yields:   # ← contract your MES connector must return
      total_capacity_hours: "number"
      bottleneck_lines: "list"
      planned_maintenance_windows: "list"
      effective_capacity_hours: "number"

    inputs:
      upstream_yields: "object"

    can_call:
      - agent: "scheduler_agent"

    auto_store_response: true
    auto_store_yields: true

  scheduler_agent:
    name: "scheduler_agent"
    agent_type: "llm"
    description: "Re-optimises the production sequence against demand + capacity"
    model: "claude-sonnet-4-6"
    temperature: 0.1
    max_completion_tokens: 3000
    communication_type: "chain"

    # Fan-in: requires demand + capacity
    wait_for: "demand_sensor_agent AND capacity_model_agent"
    wait_for_timeout: 60

    prompt: |


      You are the production scheduler. context["prepared_data"] carries the
      full operating picture pulled before you ran (pre_compose): line/shift
      capacity (effective_capacity_hours, bottleneck_lines, maintenance
      windows), the current schedule on the floor, and the BOM / on-hand
      materials. The demand picture arrives fanned-in from demand_sensor.
      Re-sequence against the REAL capacity and current schedule.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:

      {"sequenced_orders": [], "on_time_delivery_pct": 0, "unmet_demand": [], "confidence": 0, "schedule_id": "", "planner_briefing": ""}
      Re-optimise the production schedule for the window. Return JSON
      with these keys:
        - sequenced_orders: ordered list of {sku, units, line_id,
          shift_id, start_utc, end_utc}
        - on_time_delivery_pct: 0..1
        - unmet_demand: list of {sku, units_short, reason}
        - confidence: 0..1
        - schedule_id: a unique ID for this schedule
        - planner_briefing: 3-4 sentence narrative for the planner.
          Lead with on-time-delivery %, note any unmet demand and the
          top reason, and recommend whether the planner needs to
          intervene OR auto-release is safe.

    enforce_yields: true
    enforce_yields_retry: 2

    knowledge:
      serviceName: "mongo_main"
      enabled: true
      groupName: "scheduling_model"

    yields:
      sequenced_orders: "list"
      on_time_delivery_pct: "number"
      unmet_demand: "list"
      confidence: "number"
      schedule_id: "string"
      planner_briefing: "string"

    inputs:
      upstream_yields: "object"

    can_call:
      - agent: "constraint_flagger_agent"

    auto_store_response: true
    auto_store_yields: true

  constraint_flagger_agent:
    name: "constraint_flagger_agent"
    agent_type: "programmatic"
    description: "Flags conflicts: unresolvable shortages, deadline misses, safety_stock breaches"
    communication_type: "chain"

    yields:
      conflicts: "list"                  # [{type, severity, summary}]
      safety_stock_breach: "boolean"
      requires_planner_review: "boolean"
      can_auto_release: "boolean"
      schedule_id: "string"              # identity passthrough — planner_human inputs

    inputs:
      upstream_yields: "object"

    narration: |
      THREE deterministic floors ENFORCED in constraint_flagger_agent.py
      (reproducible arithmetic — never an LLM):
        1. SAFETY-STOCK / SEVERITY over scheduler unmet_demand: a
           "safety_stock" reason → severity 1.0 + breach; "shortage"/
           "supplier" → 0.8; else 0.6. Breach OR severity >= 0.7 →
           requires_planner_review.
        2. MATERIAL-AVAILABILITY: the scheduled SKUs are exploded × BOM
           against on-hand minus safety stock (pulled via pre_compose);
           any material that would breach its safety-stock floor is a
           safety_stock_breach → requires_planner_review.
        3. CAPACITY: a schedule whose load exceeds effective capacity
           physically cannot run → severity 0.8 conflict.
      can_auto_release=true ONLY when no floor fires AND every conflict is
      below severity 0.5. (To gate on SKU tier, add the lookup to the
      module — it must stay reproducible math.)

    can_call:
      # GATE POLICY (deterministic, computed in the module): planner
      # review is FORCED when safety_stock is breached or any conflict
      # has severity >= 0.7 — those schedules can NEVER auto-release.
      - agent: "planner_human"
        condition: "calling_agent_response.requires_planner_review == true"

      # GATE POLICY: auto-release ONLY when no planner review is
      # required AND every conflict is below severity 0.5 — the clean
      # re-opt path straight to MES.
      - agent: "release_agent"
        condition: "calling_agent_response.can_auto_release == true"

    auto_store_response: true
    auto_store_yields: true

  release_agent:
    name: "release_agent"
    agent_type: "programmatic"
    description: "Releases the approved schedule to MES"
    communication_type: "execute"

    yields:
      released_at_utc: "string"
      mes_job_id: "string"
      released: "boolean"

    inputs:
      schedule_id: "string"

    can_call:
      - agent: "planning_audit_logger_agent"

  # ── Scheduled re-opt HEARTBEAT — pure-YAML no-op tick. The
  # scheduled_reopt entry point targets scheduler_agent directly;
  # this agent exists only to keep the 4-hourly cadence visible and
  # observable (cron fires → tick is logged). No module, no
  # integration, no downstream calls.
  rolling_reopt_orchestrator_agent:
    name: "rolling_reopt_orchestrator_agent"
    agent_type: "programmatic"
    description: "Every 4 hours — scheduled re-optimization heartbeat tick"
    communication_type: "execute"
    wake_up: "0 */4 * * *"

    yields:
      triggered_at_utc: "string"
      plants_swept: "number"

    inputs:
      trigger: "string"

    can_call: []

  planner_human:
    name: "planner_human"
    agent_type: "human"
    is_human_powered: true
    description: "Production planner — decides on flagged schedule conflicts"
    human_interface: "default"
    communication_type: "dual"
    human_timeout_seconds: 7200

    # operator_ids: ["you@yourcompany.com"]   # optional — unset routes this
    #   gate to the SHARED inbox. Only set real operator emails: a
    #   placeholder assigns tasks to a nonexistent operator and they
    #   never appear in anyone's inbox.
    fallback_on_timeout: true
    fallback_response:
      decision: "escalate_to_plant_manager"
      message: "escalate_to_plant_manager"
      note: "Planner didn't respond — plant manager escalation"

    yields:
      decision: "string"                 # approve | revise | escalate_to_plant_manager
      notes: "string"

    inputs:
      schedule_id: "string"

    can_call:
      - agent: "release_agent"
        condition: "calling_agent_response.human_message == 'approve' or calling_agent_response.human_message == 'Approve' or calling_agent_response.human_message == 'Approved'"

      - agent: "plant_manager_human"
        condition: "calling_agent_response.human_message == 'escalate_to_plant_manager'"

  plant_manager_human:
    name: "plant_manager_human"
    agent_type: "human"
    is_human_powered: true
    description: "Plant manager — operational tier-2 + safety/quality call"
    human_interface: "default"
    communication_type: "dual"
    human_timeout_seconds: 14400

    # operator_ids: ["you@yourcompany.com"]   # optional — unset routes this
    #   gate to the SHARED inbox. Only set real operator emails: a
    #   placeholder assigns tasks to a nonexistent operator and they
    #   never appear in anyone's inbox.
    fallback_on_timeout: true
    fallback_response:
      decision: "escalate_to_ops_director"
      message: "escalate_to_ops_director"
      note: "Plant manager didn't respond — ops director escalation"

    yields:
      decision: "string"
      notes: "string"

    inputs:
      schedule_id: "string"

    can_call:
      - agent: "release_agent"
        condition: "calling_agent_response.human_message == 'approve' or calling_agent_response.human_message == 'Approve' or calling_agent_response.human_message == 'Approved'"

      - agent: "ops_director_human"
        condition: "calling_agent_response.human_message == 'escalate_to_ops_director'"

  ops_director_human:
    name: "ops_director_human"
    agent_type: "human"
    is_human_powered: true
    description: "Ops director — strategic escalation"
    human_interface: "default"
    communication_type: "dual"
    human_timeout_seconds: 28800

    # operator_ids: ["you@yourcompany.com"]   # optional — unset routes this
    #   gate to the SHARED inbox. Only set real operator emails: a
    #   placeholder assigns tasks to a nonexistent operator and they
    #   never appear in anyone's inbox.
    fallback_on_timeout: true
    fallback_response:
      decision: "halt_for_review"
      message: "halt_for_review"
      note: "Ops director unavailable — schedule held"

    yields:
      decision: "string"
      directive: "string"

    inputs:
      schedule_id: "string"

    can_call:
      - agent: "planning_audit_logger_agent"

  planning_audit_logger_agent:
    name: "planning_audit_logger_agent"
    agent_type: "external"
    description: "Hash-chained WORM audit of every release + intervention"
    framework: "custom"
    communication_type: "execute"

    connector_config:
      sink_type: "local_file"
      local_file_path: "./logs/planning_audit.jsonl"

    yields:
      audit_event_id: "string"
      written_at_utc: "string"
      hash_chain_prev: "string"
      hash_chain_current: "string"

    inputs:
      session_id: "string"
      payload: "object"

    can_call: []

  # ────────────────────────────────────────────────────────────
  # supplier_signal_agent — supplier delays → propagate to schedule
  # Real plant pain: supplier slip the floor doesn't hear about
  # until material is missing
  # ────────────────────────────────────────────────────────────
  supplier_signal_agent:
    name: "supplier_signal_agent"
    agent_type: "llm"
    description: "Ingests supplier delay/quality signals; recommends schedule adjustments before the floor feels it"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 1000
    communication_type: "chain"

    prompt: |


      You are the supplier-risk analyst. context["prepared_data"] carries the
      supplier master (reliability, alternates), the current schedule the
      slip would hit, and on-hand materials — pulled before you ran
      (pre_compose). Reason over the real alternates and lead times.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:

      {"supplier_id": "", "signal_type": "", "affected_skus": [], "delay_days": 0, "propagation_summary": "", "alternate_supplier_options": [], "severity": 0, "requires_planner_review": false}
      A supplier signal arrived (delay notice, quality issue, capacity
      change, force-majeure). Return JSON with these keys:
        - supplier_id: which supplier
        - signal_type: delay | quality | capacity_cut | force_majeure | early_delivery
        - affected_skus: list of affected SKU IDs
        - delay_days: integer (negative if early delivery)
        - propagation_summary: customer-ready summary of impact (which
          production runs affected; suggested action)
        - alternate_supplier_options: list of {supplier_id, lead_time_days, cost_delta_pct}
        - severity: 0..1
        - requires_planner_review: boolean — apply the hard rules below

      Set "requires_planner_review" true when (a) severity >= 0.3 and
      "alternate_supplier_options" is empty, (b) "signal_type" ==
      force_majeure, or (c) severity >= 0.5. (These rules are ALSO
      enforced deterministically in supplier_signal_agent.py's @chain
      floor — including the single-source case — so the gate cannot be
      under-rated even if you miss one.)

      Be honest about probability. Supplier ETAs are often optimistic
      — don't take them at face value.

    enforce_yields: true
    enforce_yields_retry: 1

    knowledge:
      serviceName: "mongo_main"
      enabled: true
      groupName: "supplier_master"

    yields:
      supplier_id: "string"
      signal_type: "string"
      affected_skus: "list"
      delay_days: "number"
      propagation_summary: "string"
      alternate_supplier_options: "list"
      severity: "number"
      requires_planner_review: "boolean"

    inputs:
      supplier_signal: "object"

    can_call:
      - agent: "planner_human"
        condition: "calling_agent_response.requires_planner_review == true"

      - agent: "scheduler_agent"
        condition: "calling_agent_response.requires_planner_review == false"

  # ────────────────────────────────────────────────────────────
  # material_requirements_agent — BOM × demand MRP explosion,
  # answered by YOUR ERP / MRP system
  # ────────────────────────────────────────────────────────────
  material_requirements_agent:
    name: "material_requirements_agent"
    agent_type: "programmatic"
    description: "Runs the MRP explosion (demand × BOM → raw-material requirements + shortages) in your ERP / MRP system"
    communication_type: "chain"

    # ── YOUR SYSTEM OF RECORD ────────────────────────────────────
    # Bills of material and on-hand inventory live in your ERP / MRP
    # (SAP, Oracle, NetSuite, Odoo…), not in this template. Point
    # this connector at an MCP gateway (or swap integration to
    # n8n/zapier) that runs the explosion and returns the yields
    # below.
    integration: "mcp"
    connector_config:
      transport: "http"
      url: "${ERP_MRP_MCP_URL:}"        # your ERP / MRP MCP gateway
      tool_name: "run_mrp_explosion"    # must return the yields below
      timeout: 60

    yields:   # ← contract your ERP/MRP connector must return
      mode: "string"
      requirements: "list"
      shortages: "list"
      has_critical_shortage: "boolean"
      mrp_briefing: "string"
    inputs:
      mode: "string"
      product_sku: "string"
      material_sku: "string"
      qty_per_unit: "number"
      qty_on_hand: "number"
      supplier_id: "string"
      lead_time_days: "number"
      demand_by_product: "object"
    can_call: []

    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # planning_analytics_agent — one analytics ROLE, two
  # responsibilities (mode-dispatched by your historian):
  #   1. per-shift OEE / availability / performance / quality
  #      tracking (mode=ingest|report)
  #   2. demand-forecast backtest (mode=backtest) —
  #      MAPE/bias/tracking-signal per SKU → model recommendations
  # Shift KPI rows and forecast-vs-actual history live in your MES
  # historian / data warehouse, not in template SQLite.
  # ────────────────────────────────────────────────────────────
  planning_analytics_agent:
    name: "planning_analytics_agent"
    agent_type: "programmatic"
    description: "Planning analytics — per-shift OEE/availability/performance/quality rollups + forecast backtests (MAPE/bias/tracking signal → model recommendations), answered by your MES historian"
    communication_type: "chain"
    # wake_up: "0 6 * * 1"   # enable after wiring your MES historian connector

    # ── YOUR SYSTEM OF RECORD ────────────────────────────────────
    # OEE rollups and forecast accuracy come from your MES historian
    # (PI, Ignition, a lakehouse view…). Point this connector at an
    # MCP gateway (or swap integration to n8n/zapier) that returns
    # the yields below for the requested mode.
    integration: "mcp"
    connector_config:
      transport: "http"
      url: "${MES_HISTORIAN_MCP_URL:}"   # your MES historian MCP gateway
      tool_name: "get_planning_analytics"  # must return the yields below
      timeout: 60

    yields:   # ← contract your historian connector must return
      mode: "string"
      # shift KPI / OEE tracking
      line_id: "string"
      horizon_days: "number"
      recent: "object"
      prior: "object"
      oee_delta_pct_points: "number"
      requires_pm_action: "boolean"
      kpi_briefing: "string"
      # demand forecast backtest
      evaluations: "list"
      evaluation_count: "number"
      window_days: "number"
      underperforming_skus: "list"
      underperformer_count: "number"
      requires_planner_review: "boolean"
      evaluated_at_utc: "string"

    inputs:
      mode: "string"
      line_id: "string"
      shift_date: "string"
      scheduled_mins: "number"
      uptime_mins: "number"
      target_units: "number"
      actual_units: "number"
      good_units: "number"
      downtime_cause: "string"
      horizon_days: "number"
      forecast_vs_actual: "list"        # [{sku, forecast, actual, pattern}]
      window_days: "number"

    narration: |
      OEE tracking: requires_pm_action=true when OEE drops more than
      5 points vs the prior horizon — chronic same-line drops are the
      bottleneck pattern the manager watches for.

      MAPE targets by pattern:
        smooth 8%, trending 12%, seasonal 15%, lumpy 30%, intermittent 50%.

      Recommendations:
        - rebias_model: |bias| > 0.15
        - change_model_class: |tracking_signal| > 4
        - increase_smoothing_weight: misses target but stable
        - model_excellent: beats target by 50%

    can_call:
      - agent: "planner_human"
        condition: "calling_agent_response.requires_planner_review == true"

    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # capacity_what_if_agent — production scenario simulator
  # ────────────────────────────────────────────────────────────
  capacity_what_if_agent:
    name: "capacity_what_if_agent"
    agent_type: "llm"
    description: "Scenario simulator — what if we add a shift / lose a line / demand spikes 30%? Projects throughput + cost + schedule fit"
    model: "claude-sonnet-4-6"
    temperature: 0.1
    max_completion_tokens: 2500
    communication_type: "chain"

    prompt: |


      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:

      {"run_id": "", "scenario_type": "", "parameters": {}, "baseline_throughput": 0, "projected_throughput": 0, "throughput_delta_pct": 0, "cost_delta_cents": 0, "schedule_fit_pct": 0, "risk_flags": [], "recommendation": "", "requires_planner_review": false, "run_at_utc": ""}
      Simulate the scenario. Return JSON with these keys:
        - run_id: "whatif-<scenario_type>-<epoch seconds>" (e.g.
            "whatif-line_down-1718000000")
        - scenario_type / parameters / baseline_throughput: echo of
            the inputs you simulated
        - projected_throughput: integer units / period
        - throughput_delta_pct: (projected - baseline) / baseline
            * 100, rounded to 1 decimal; 0 when baseline is 0
        - cost_delta_cents: signed (positive = more cost)
        - schedule_fit_pct: 0..1 — what fraction of committed orders
            still fit in window
        - risk_flags: list of free-text risks
        - run_at_utc: current UTC timestamp, ISO-8601

      Scenario types:
        add_shift, drop_shift, line_down, line_added,
        demand_spike, demand_drop, labour_strike,
        supplier_outage, feedstock_price_change

      Recommendation policy — set "recommendation" by the FIRST
      matching rule:
        - proceed: scenario_type is add_shift or line_added AND
            throughput_delta_pct > 0 AND schedule_fit_pct >= 0.85
        - mitigate_required: scenario_type is line_down or
            supplier_outage AND (schedule_fit_pct < 0.60 OR
            throughput_delta_pct < -15)
        - capacity_gap: scenario_type is demand_spike AND
            schedule_fit_pct < 0.70
        - review: any risk_flags present
        - neutral: otherwise

      Hard rule: "requires_planner_review" = true EXACTLY when
      "recommendation" is mitigate_required, capacity_gap, or review;
      false otherwise.

      Don't extrapolate past 90 days — uncertainty too high.

    enforce_yields: true

    knowledge:
      serviceName: "mongo_main"
      enabled: true
      groupName: "capacity_model_params"

    yields:
      run_id: "string"
      scenario_type: "string"
      parameters: "object"
      baseline_throughput: "number"
      projected_throughput: "number"
      throughput_delta_pct: "number"
      cost_delta_cents: "number"
      schedule_fit_pct: "number"
      risk_flags: "list"
      recommendation: "string"
      requires_planner_review: "boolean"
      run_at_utc: "string"

    inputs:
      scenario_type: "string"
      parameters: "object"
      baseline_throughput: "number"

    can_call:
      - agent: "planner_human"
        condition: "calling_agent_response.requires_planner_review == true"

    auto_store_response: true
    auto_store_yields: true

