# production-planning — Production-Planning Pod
#
# A pod of digital employees + human plant roles that runs a production
# schedule change end to end: a signal arrives -> the operating picture is
# sensed line-by-line (confidence-scored) -> the sequence is re-optimised
# -> a DETERMINISTIC gate decides auto-release vs human review -> a planner
# (then plant manager, then ops director) decides the exceptions -> the
# finisher pushes the approved schedule to the MES and fails closed -> the
# WORM sink records every release and intervention.
#
# The pod is a TEAM, not a pipeline. Every wire is conditional; every
# hand-off is a finished contract; nothing is released on silence; the
# finisher produces the real artifact and fails closed; the WORM sink is the
# terminus. Systems (MES / ERP / MRP) are TOOLS inside
# agents, never members.
#
# Design doctrine: .claude/skills/leafmesh/building-agents-thoroughly.md
# Field reference:  .claude/skills/leafmesh/agent-config-fields.md

name: "production-planning"
version: 1.0.0
architecture: managed_mesh
environment: development
debug: true
log_level: INFO

auto_discover:
  directory: ./agency
  pattern: '*_agent.py'

# The Manager is the SUPERVISOR, not a router in the middle of the team
# (static routing). It escalates to the Ops Director on a non-retryable error
# (auth / bad request / credit / bad config), when 5 different agents fail in
# one case (max_errors_per_session), or when restarts run out. A malformed
# hand-off only alerts. A question nobody answers is NOT escalated: the card
# closes and the ticket records that no reply came. The re-sense loop and the
# safety-stock route are can_call wires (Rex → Ops Director, Gaia → plant manager).
manager:
  model: gpt-4o-mini
  domain: generic
  prompt: |
    This mesh runs production planning + scheduling. A successful change
    flows demand+capacity sensed line-by-line (Sensa) -> re-optimised
    (Rex) -> the deterministic auto-release gate (Gaia) -> a clean re-opt
    auto-releases to the MES (Milo, the finisher); a flagged one goes to a
    planner, a safety-stock breach to the plant manager, and an exhausted
    re-sense loop to the Ops Director — those are the team's own wires. You
    escalate to the Ops Director when agents keep failing. Silence never
    advances a release.
  routing:
    mode: static
  escalation:
    targets:
      - type: human_agent
        agent: ops_director_human
      # Webhook escalation (e.g. PagerDuty): create the vault connection
      # 'escalation_webhook' (an "Add custom" record on the Infrastructure
      # page, service type 'Outbound webhook'), then uncomment — here before the
      # first start, in Studio's YAML editor after it (applies live, no restart).
      # - type: webhook
      #   connection: escalation_webhook   # vault connection holds the URL + headers
      # Slack escalation: posting needs a Slack adapter, which comes from a
      # human seat's channels block. Connect Slack on Infrastructure →
      # Messaging → Slack (vault record, e.g. 'slack_plant'), give
      # ops_director_human `channels: {slack: {connection: slack_plant}}`, set
      # SLACK_PLANT_CHANNEL in .env, then uncomment — here before the first
      # start, in Studio's YAML editor after it.
      # - type: channel
      #   provider: slack
      #   channel_id: "${SLACK_PLANT_CHANNEL:}"
    auto_escalate:
      max_retries: 3
      max_errors_per_session: 5

# 2.4.131 runtime block — the ONE non-default this pod genuinely needs:
# Rex re-optimises as a super_agent (plan/execute/verify) and can run long.
# Everything else stays default (omission is meaningful).
timeouts:
  mesh_call_default_timeout_s: 150
  llm_hard_timeout_s: 300

# ── Entry points — one per real-world trigger ────────────────────────────────
entry_points:
  - name: demand_signal
    target: plan_coordinator_agent
    description: "A new forecast or actual-order shift arrives — the coordinator opens a change case."
    condition: always
  - name: capacity_change
    target: plan_coordinator_agent
    description: "A line goes down / a shift changes / equipment maintenance — the coordinator opens a case."
    condition: always
  - name: schedule_status
    target: plan_coordinator_agent
    description: "Anyone asks 'where is my schedule?' — the coordinator answers from the case record."
    condition: always
  - name: daily_sweep
    target: demand_sensor_agent
    description: "Scheduled line-by-line re-sense of demand vs capacity across the plant."
    condition: always
  - name: supplier_signal
    target: supplier_signal_agent
    description: "A supplier delay / quality / capacity / force-majeure signal arrives."
    condition: always
  - name: planner_reply
    target: planner_human
    description: "HITL resume — a planner answers a review or approves a schedule."
    condition: always

agents:

  # ─────────────────────────────────────────────────────────────────────────
  # Nova — Plan Coordinator (AI). Owns each schedule-change case end to end:
  # opens it, orchestrates the pod, keeps live status, is the planner's one
  # contact. Pure orchestration — never senses demand, never schedules, never
  # approves. (Pure YAML.)
  # ─────────────────────────────────────────────────────────────────────────
  plan_coordinator_agent:
    name: plan_coordinator_agent
    communication_type: chain
    agent_type: llm
    model: gpt-4o-mini
    temperature: 0.1
    description: "Plan Coordinator — opens the change case, orchestrates, keeps status, single point of contact."
    prompt: |
      You are Nova, the Plan Coordinator. You OWN each production-schedule
      change from the moment a signal arrives to the moment it is released.
      You orchestrate the pod and keep the planner informed — you never
      sense demand, re-optimise a schedule, or approve anything yourself.

      On a new demand or capacity signal: open a case, record the plant and
      the time, hand it to the demand sensor. On a status ask: answer the
      current stage / waiting-on / next gate from the case record — nothing
      invented. Route anything you cannot place to the Ops Director; never
      make the plant call yourself.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"action": ..., "schedule_id": ..., "plant_id": ..., "stage": ..., "waiting_on": ..., "summary": ...}
    yields:
      action: "string"        # open_case | status | escalate
      schedule_id: "string"
      plant_id: "string"
      stage: "string"
      waiting_on: "string"
      summary: "string"
    can_call:
      - agent: demand_sensor_agent
        condition: "calling_agent_response.action == 'open_case'"
      - agent: ops_director_human
        condition: "calling_agent_response.action == 'escalate'"

  # ─────────────────────────────────────────────────────────────────────────
  # Sensa — Demand & Capacity Sensor (AI). Senses the operating picture
  # line-by-line: claims a line, reads its demand and capacity, scores every
  # SKU's confidence, and REFUSES to guess. A SKU it cannot read with
  # confidence is flagged, never a made-up number in a schedule.
  #   copies.count: 3 → three copies sweep the plant's lines in parallel;
  #   claim_line    → each copy claims a DIFFERENT line (no duplicate work).
  # @chain re-averages confidence across the copies (handoff: last SUMs numbers —
  # a footgun for a ratio) and enforces the confidence floor.
  # ─────────────────────────────────────────────────────────────────────────
  demand_sensor_agent:
    name: demand_sensor_agent
    communication_type: chain
    agent_type: llm
    model: gpt-4o-mini
    temperature: 0.1
    max_tool_calls_per_message: 12   # claim + read demand + read capacity per line; default 5 truncates silently
    description: "Demand & Capacity Sensor — claims a line, reads its demand + capacity, scores confidence, refuses to guess."
    # Line fan-out: 3 copies per activation, each claims a disjoint line.
    scaling:                      # 2.4.484 (was instances / instances_handoff)
      copies:
        mode: fixed
        count: 3
        handoff: last          # COMBINE the copies and route once
    # Scheduled sweep — daily, in the plant's timezone (NOT UTC). Also
    # reachable via the daily_sweep entry point.
    wake_up: "0 6 * * *"
    timezone: "America/Los_Angeles"
    wake_up_input:
      trigger: daily_sweep
    prompt: |
      You are Sensa, the Demand & Capacity Sensor. Your job is to turn a
      production line into a confidence-scored demand-and-capacity picture —
      and to REFUSE to guess. FIRST call claim_line to claim ONE line (each
      parallel copy of you claims a different line). Then read that line's
      demand and its capacity, and score every SKU's demand 0-1.

      NEVER invent a SKU, a unit count, or a due date no source shows. A SKU
      you cannot read with confidence goes in low_confidence_skus and keeps
      the picture un-clean — it is never a silent guess downstream. Report
      the line's effective capacity in lines_read. Load the `sensing`
      playbook for the exact claim-then-read order.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"picture_clean": ..., "plant_id": ..., "schedule_id": ..., "sku_demands": ...,
       "lines_read": ..., "low_confidence_skus": ..., "lines_claimed": ..., "confidence": ..., "notes": ...}
    yields:
      picture_clean: "boolean"
      plant_id: "string"
      schedule_id: "string"
      sku_demands:                 # one per SKU; units / due_date null when unreadable (the floor flags it)
        type: array
        items:
          type: object
          fields: {sku: string, units: {type: number, nullable: true}, due_date: {type: string, nullable: true}, confidence: number}
      lines_read:                  # per-line {line_id, effective_capacity_hours, is_bottleneck}
        type: array
        items:
          type: object
          fields: {line_id: string, effective_capacity_hours: number, is_bottleneck: boolean}
      low_confidence_skus: {type: array, items: string}
      lines_claimed: "number"      # SUMS across copies — correct (count of lines this sweep claimed)
      confidence: "number"         # re-averaged in @chain (SUM would be wrong for a ratio)
      notes: "string"
    # Playbook — the CRAFT, fetched on demand. Only `description` rides in the
    # prompt; `responsibility` is loaded when the model recognises the intent.
    playbook:
      - intent: sensing
        description: "How to claim a line and read its demand + capacity without guessing."
        responsibility: |
          1. Call claim_line(plant_id) ONCE. If available:false, you have no
             line to sense — return picture_clean:false with a note; do NOT
             read another copy's line.
          2. read_line_demand(plant_id, line_id) and
             read_line_capacity(plant_id, line_id) for the CLAIMED line only.
          3. Score every SKU's demand 0-1 against how legibly the source
             gave units + due date. Anything below 0.85, or any SKU the read
             marked unavailable, goes in low_confidence_skus.
          4. Put the line's effective_capacity_hours + is_bottleneck in
             lines_read. Set lines_claimed to 1 when you claimed a line, 0
             when claim_line returned available:false.
        variables: [plant_id]
    # Day-0 tool surface — reads the seed plant snapshot so the pod runs with
    # NO connector wired. Each tool announces itself (available:false) when it
    # has no real source. See agency/tools.py.
    tools: [claim_line, read_line_demand, read_line_capacity, list_prior_schedules]
    tool_categories: [planning]
    # ── To wire real MES/ERP: create the vault connections 'mes_mcp' and
    #    'erp_mrp_mcp' on Infrastructure → Integrations → MCP (each an MCP server's
    #    connection: its address + token), then uncomment — here before the first
    #    start, in Studio's YAML editor after it (applies live, no restart). Each
    #    named action under `use:` becomes its own tool. The address and token live only in
    #    the vault — never write url:/token: here. ──
    # mcp:
    #   - connection: mes_mcp
    #     transport: http
    #     use: [get_line_capacity, get_maintenance_windows]
    #     name: mes
    #     timeout: 30
    #   - connection: erp_mrp_mcp
    #     transport: http
    #     use: [get_line_demand, run_mrp_explosion]
    #     name: erp
    #     timeout: 30
    can_call:
      - agent: scheduler_agent
        condition: "calling_agent_response.picture_clean == true"
      - agent: ops_director_human
        condition: "calling_agent_response.picture_clean == false"

  # ─────────────────────────────────────────────────────────────────────────
  # Rex — Production Scheduler (AI, Super-Agent). Re-optimises the sequence
  # from Sensa's verified picture across lines + shifts, computes on-time
  # delivery, writes the planner briefing, and renders the draft schedule to
  # ./out. super_agent = autonomous plan/execute/verify over a multi-line
  # re-opt. @chain = the cross-check floor (fail closed) + the pre-gate stash
  # + a BOUNDED back-edge counter (never loop re-sensing forever).
  # ─────────────────────────────────────────────────────────────────────────
  scheduler_agent:
    name: scheduler_agent
    communication_type: chain
    agent_type: llm
    model: claude-sonnet-4-6
    temperature: 0.1
    description: "Production Scheduler — re-optimises the sequence from the verified picture, cross-checks, briefs the planner."
    super_agent:                     # dict form = the tuning path (2.4.123+)
      cost_ceiling: 120000
      wall_clock: 900
    prompt: |
      You are Rex, the Production Scheduler. Turn Sensa's verified
      demand-and-capacity picture into an optimised production sequence
      across the plant's lines and shifts. Cross-check every order's units,
      line, shift and due date against the source picture BEFORE anyone sees
      the schedule. Lead the planner_briefing with on-time-delivery %, name
      any unmet demand and its top reason, and say whether auto-release is
      safe or the planner should look. If a cross-check does not tie out,
      return it to Sensa with the specific discrepancy — never force an order
      to fit. Load the `reoptimize` playbook for the assembly + cross-check
      order.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"schedule_built": ..., "cross_check_ok": ..., "discrepancy": ..., "reopt_retry_exhausted": ...,
       "sequenced_orders": ..., "on_time_delivery_pct": ..., "unmet_demand": ...,
       "schedule_id": ..., "confidence": ..., "planner_briefing": ...}
    yields:
      schedule_built: "boolean"
      cross_check_ok: "boolean"
      discrepancy: "string"
      reopt_retry_exhausted: "boolean"   # loop guard for the back-edge to Sensa
      sequenced_orders:                  # the floor cross-checks sku / units / line_id
        type: array
        items:
          type: object
          fields: {sku: string, units: number, line_id: string, shift_id: string}
      on_time_delivery_pct: "number"
      unmet_demand:                      # the gate reads reason (safety_stock / shortage / supplier)
        type: array
        items:
          type: object
          fields: {sku: string, units_short: number, reason: string}
      schedule_id: "string"
      confidence: "number"
      planner_briefing: "string"
    playbook:
      - intent: reoptimize
        description: "How to re-sequence the schedule and cross-check it against the source."
        responsibility: |
          1. Sequence each SKU onto a line that can make it, within its
             shifts, before its due date. Keep every order traceable to the
             sensed demand it came from.
          2. Re-check units, line, shift and due dates against the picture.
             If an order references a SKU or line the picture did not sense,
             or its units exceed the line's effective capacity, that is a
             cross-check discrepancy — return it to Sensa; do NOT adjust a
             number to make it fit.
          3. Compute on_time_delivery_pct and list any unmet_demand with a
             reason (use "safety_stock" / "shortage" / "supplier" in the
             reason when that is the cause — the gate reads it).
          4. Mint a schedule_id and write the planner_briefing.
        variables: [schedule_id]
    can_call:
      # Bounded back-edge — re-sense only until the exhaustion flag trips.
      - agent: demand_sensor_agent
        condition: "calling_agent_response.cross_check_ok == false and calling_agent_response.discrepancy != '' and calling_agent_response.reopt_retry_exhausted == false"
      # Terminal route when re-sense retries are spent — NEVER loop again.
      - agent: ops_director_human
        condition: "calling_agent_response.cross_check_ok == false and calling_agent_response.reopt_retry_exhausted == true"
      # Clean schedule → the deterministic gate.
      - agent: constraint_flagger_agent
        condition: "calling_agent_response.cross_check_ok == true"

  # ─────────────────────────────────────────────────────────────────────────
  # Gaia — Auto-Release Gate (programmatic, DETERMINISTIC — never an LLM).
  # The auto-release decision is irreversible plant action, so it is
  # reproducible arithmetic a model may not waive. THREE floors: safety-stock
  # / severity over unmet demand, material-availability (SKUs × BOM vs on-hand
  # minus safety stock), and capacity (load vs effective hours). A safety
  # breach → the plant manager; any other review → the planner; a clean re-opt
  # → the finisher. See agency/constraint_flagger_agent.py.
  # ─────────────────────────────────────────────────────────────────────────
  constraint_flagger_agent:
    name: constraint_flagger_agent
    communication_type: chain
    agent_type: programmatic
    description: "Auto-Release Gate — three deterministic floors decide auto-release vs a human, reproducible math never an LLM."
    yields:
      conflicts: "array"                 # [{type, severity, summary}]
      safety_stock_breach: "boolean"
      requires_planner_review: "boolean"
      can_auto_release: "boolean"
      schedule_id: "string"              # identity passthrough — the human inbox renders it
    can_call:
      # Safety-stock breach is the plant-manager's safety/quality call.
      - agent: plant_manager_human
        condition: "calling_agent_response.safety_stock_breach == true"
      # Any other required review → the planner.
      - agent: planner_human
        condition: "calling_agent_response.requires_planner_review == true and calling_agent_response.safety_stock_breach == false"
      # Clean re-opt → straight to the finisher (the gate IS the authorization).
      - agent: release_agent
        condition: "calling_agent_response.can_auto_release == true"

  # ─────────────────────────────────────────────────────────────────────────
  # Milo — MES Release Finisher (programmatic FINISHER / actuator). Sits
  # BEHIND the gate + the human approval. It never approves — it RE-CHECKS
  # authorization (an allow-token allowlist + block-token denylist; an
  # unknown verdict fails closed; the gate's can_auto_release is the other
  # authorized path), re-derives deterministic invariants (a schedule_id, real
  # orders, no double-release), renders the release pack to ./out, DELETES the
  # partial on a tripped floor, and records an append-only ledger entry. It
  # recovers the schedule from the session stash / dev store across the HITL
  # gate. See agency/release_agent.py.
  # ─────────────────────────────────────────────────────────────────────────
  release_agent:
    name: release_agent
    communication_type: chain
    agent_type: programmatic
    description: "MES Release Finisher — re-checks authorization, renders the release pack, pushes to MES, fails closed, ledgers."
    yields:
      released: "boolean"
      released_at_utc: "string"
      mes_job_id: "string"
      pack_path: "string"
      status: "string"          # released | recorded_dev | blocked
      block_reasons: "array"
    can_call:
      - agent: planning_audit_logger_agent
        condition: "always"

  # ─────────────────────────────────────────────────────────────────────────
  # Sable — Supplier-Risk Analyst (AI). Ingests a supplier delay / quality /
  # capacity / force-majeure signal, reasons over the supplier master and
  # affected schedule, proposes alternates. @chain review floor re-derives
  # requires_planner_review so an LLM can't under-rate a slip (force-majeure,
  # severity floors, single-source). Routine → re-plan (scheduler); severe →
  # the planner. See agency/supplier_signal_agent.py.
  # ─────────────────────────────────────────────────────────────────────────
  supplier_signal_agent:
    name: supplier_signal_agent
    communication_type: chain
    agent_type: llm
    model: gpt-4o-mini
    temperature: 0.1
    max_tokens: 1200
    description: "Supplier-Risk Analyst — ingests supplier signals, proposes alternates, forces a human on a slip it can't safely absorb."
    prompt: |
      You are Sable, the Supplier-Risk Analyst. A supplier signal arrived
      (delay, quality, capacity cut, force-majeure, or early delivery).
      Reason over the supplier master and the schedule the slip would hit —
      which production runs are affected and what to do. Be honest about
      probability: supplier ETAs are often optimistic, so do not take them at
      face value. Propose alternate suppliers where they exist. Load the
      `supplier_triage` playbook for the review rules.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"supplier_id": ..., "signal_type": ..., "affected_skus": ..., "delay_days": ...,
       "propagation_summary": ..., "alternate_supplier_options": ..., "severity": ..., "requires_planner_review": ...}
    yields:
      supplier_id: "string"
      signal_type: "string"      # delay | quality | capacity_cut | force_majeure | early_delivery
      affected_skus: {type: array, items: string}
      delay_days: "number"
      propagation_summary: "string"
      alternate_supplier_options: {type: array, items: {type: object, fields: {supplier_id: string}}}
      severity: "number"
      requires_planner_review: "boolean"
    playbook:
      - intent: supplier_triage
        description: "When a supplier slip must go to a human vs be re-planned automatically."
        responsibility: |
          Force requires_planner_review true when (a) signal_type is
          force_majeure, (b) severity >= 0.5, (c) severity >= 0.3 with no
          alternate_supplier_options, or (d) the supplier is single-source
          (no alternates in the master) and severity > 0. These are ALSO
          re-derived deterministically in the @chain floor, so the gate
          cannot be under-rated even if you miss one. Otherwise the slip can
          be absorbed by an automatic re-plan.
        variables: [supplier_id]
    can_call:
      - agent: planner_human
        condition: "calling_agent_response.requires_planner_review == true"
      - agent: scheduler_agent
        condition: "calling_agent_response.requires_planner_review == false"

  # ─────────────────────────────────────────────────────────────────────────
  # Human members — first-class, answered in Studio's Inbox. Timeouts follow
  # the plant's working day: the planner answers a flagged schedule inside
  # 2h of the same shift; the plant manager makes a safety-stock call within
  # 4h; the ops director answers within a business day (8h).
  # If nobody answers in time, the request waits no longer: its Inbox card
  # closes and the ticket records that no reply came. Nothing is released on
  # silence, and nobody is chased automatically. fallback_on_timeout /
  # fallback_response state the intended default-deny (held_for_review ->
  # audit); leafmesh 2.4.486 does not route it for these dual seats yet.
  # Every value a seat asks for (approved / rejected / held_for_review) has
  # a route. `dual` belongs on the human/boundary agents ONLY.
  # ─────────────────────────────────────────────────────────────────────────

  planner_human:
    name: planner_human
    agent_type: human
    human_interface: "default"   # the Inbox (no vault connection needed)
    communication_type: dual
    human_timeout_seconds: 7200     # 2 hours to decide a flagged schedule / supplier review
    description: "Production planner — decides flagged schedules and supplier reviews; approves release."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    can_call:
      # Approved a supplier review → re-plan now that the planner has OK'd it.
      - agent: scheduler_agent
        condition: "calling_agent_response.from_agent == 'supplier_signal_agent' and calling_agent_response.human_message == 'approved'"
      # Approved a flagged schedule → the finisher (fail-closed re-check).
      - agent: release_agent
        condition: "calling_agent_response.from_agent == 'constraint_flagger_agent' and calling_agent_response.human_message == 'approved'"
      # Rejected or held → record it. Nothing is released.
      - agent: planning_audit_logger_agent
        condition: "calling_agent_response.human_message == 'rejected' or calling_agent_response.human_message == 'held_for_review'"
    yields:
      human_message: "string"       # approved | rejected | held_for_review
    inputs:
      review: "object"

  plant_manager_human:
    name: plant_manager_human
    agent_type: human
    human_interface: "default"   # the Inbox (no vault connection needed)
    communication_type: dual
    human_timeout_seconds: 14400    # 4 hours — the safety/quality tier
    description: "Plant manager — the safety/quality call on a safety-stock breach; approves or holds."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    can_call:
      - agent: release_agent
        condition: "calling_agent_response.human_message == 'approved'"
      - agent: planning_audit_logger_agent
        condition: "calling_agent_response.human_message == 'rejected' or calling_agent_response.human_message == 'held_for_review'"
    yields:
      human_message: "string"       # approved | rejected | held_for_review
    inputs:
      breach: "object"

  ops_director_human:
    name: ops_director_human
    agent_type: human
    human_interface: "default"   # the Inbox (no vault connection needed)
    communication_type: dual
    human_timeout_seconds: 28800    # 8 hours — accountable owner, strategic escalation, final tier
    description: "Operations director — accountable owner; reviews exceptions and unresolvable cases. Everything that leaves the pod."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    can_call:
      - agent: release_agent
        condition: "calling_agent_response.human_message == 'approved'"
      - agent: planning_audit_logger_agent
        condition: "calling_agent_response.human_message == 'rejected' or calling_agent_response.human_message == 'held_for_review'"
    yields:
      human_message: "string"       # approved | rejected | held_for_review
    inputs:
      exception: "object"

  # ─────────────────────────────────────────────────────────────────────────
  # WORM audit sink — hash-chained, append-only, the terminus of every path.
  # Registered in main.py via sdk.intelligence("planning_audit_logger_agent").
  # ─────────────────────────────────────────────────────────────────────────
  planning_audit_logger_agent:
    name: planning_audit_logger_agent
    agent_type: external
    framework: custom
    communication_type: chain
    description: "WORM audit — hash-chains every release, approval, hold and intervention. Terminus."
    connector_config:
      sink_type: local_file
